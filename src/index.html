<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Mazadat | مزادات</title>
  <base href="/" />

  <!-- Responsive / Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />

  <!-- SEO Basic -->
  <meta name="description" content="منصة متخصصة في شراء وبيع المركبات عبر المزادات الإلكترونية، نوفر مجموعة واسعة من المركبات مع ضمان الشفافية والموثوقية. انضم إلينا لتجربة مزادات آمنة وسهلة في أي وقت ومن أي مكان." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Mazadat" />
  <meta name="application-name" content="Mazadat" />

  <!-- Canonical -->
  <link rel="canonical" href="https://mazadat.elm.sa/" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mazadat | مزادات" />
  <meta property="og:title" content="Mazadat | منصة مزادات المركبات الإلكترونية" />
  <meta property="og:description" content="شراء وبيع المركبات عبر مزادات إلكترونية آمنة وشفافة، مع تشكيلة واسعة من السيارات وتجربة سهلة من أي مكان." />
  <meta property="og:url" content="https://mazadat.elm.sa/" />
  <meta property="og:image" content="https://mazadat.sa/assets/images/mazadat-logo-fill.svg" />
  <meta property="og:locale" content="ar_SA" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mazadat | منصة مزادات المركبات الإلكترونية" />
  <meta name="twitter:description" content="شراء وبيع المركبات عبر مزادات إلكترونية آمنة وشفافة، مع تجربة سهلة من أي مكان وفي أي وقت." />
  <meta name="twitter:image" content="https://mazadat.sa/assets/images/mazadat-logo-fill.svg" />

  <!-- Favicon / Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <!-- PWA (optional if you use it) -->
  <link rel="manifest" href="assets/manifest.webmanifest" />

  <!-- Runtime Environment -->
  <script src="env.js"></script>

  <!-- Auto set lang & dir before Angular bootstraps -->
  <script>
    (function () {
      try {
        var lang = localStorage.getItem('lang') || 'ar';
        var dir = (lang === 'ar' || lang === 'fa' || lang === 'ur') ? 'rtl' : 'ltr';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', dir);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <noscript>
    يتطلب تشغيل هذه المنصة تفعيل JavaScript.
  </noscript>

  <app-root></app-root>
</body>
</html>
