<div class="row g-3">
    <div class="col-12">
        <nav class="add-vehicle-single__breadcrumb" aria-label="breadcrumb">
            <a routerLink="/vehicles" class="add-vehicle-single__breadcrumb-link">
                {{ 'sideMenu.vehicles.label' | t }}
            </a>
            <span class="add-vehicle-single__breadcrumb-separator" aria-hidden="true">
                <i class="pi pi-chevron-left"></i>
            </span>
            <span class="add-vehicle-single__breadcrumb-current" aria-current="page">
                {{ 'vehiclesManagement.addSingle.pageTitle' | t }}
            </span>
        </nav>
        <div class="d-flex align-items-center gap-2 page-title">
            <app-button [iconOnly]="true" icon="pi pi-play" variant="outline" size="sm" extraClass="add-vehicle-single__video-btn" [ariaLabel]="'vehiclesManagement.addSingle.videoGuide' | t" />
            <app-typography tag="h2" variant="h3" weight="bold" [text]="'vehiclesManagement.addSingle.pageTitle' | t" extraClass="mb-0" />
        </div>
    </div>

    <div class="col-12">
        <div class="add-vehicle-stepper card p-3">
            @for (step of steps; track step.label; let i = $index; let last = $last) {
            <div class="add-vehicle-stepper__step" [class.add-vehicle-stepper__step--active]="i === currentStep()" [class.add-vehicle-stepper__step--completed]="i < currentStep()">
                <div class="add-vehicle-stepper__icon">
                    <i [class]="step.icon" aria-hidden="true"></i>
                </div>
                <div class="add-vehicle-stepper__info">
                    <span class="add-vehicle-stepper__label">{{ step.label }}</span>
                    @if (step.optional) {
                    <span class="add-vehicle-stepper__optional">
                        {{ 'vehiclesManagement.addSingle.optional' | t }}
                    </span>
                    }
                </div>
            </div>
            @if (!last) {
            <div class="add-vehicle-stepper__connector"></div>
            }
            }
        </div>
    </div>

    <div class="col-12">
        <div class="card">
            <div class="card-body p-3 p-md-4">
                <app-typography tag="h3" variant="h5" weight="bold" [text]="'vehiclesManagement.addSingle.basicDataTitle' | t" extraClass="mb-4" />

                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <label class="form-label small mb-1 d-block">
                            {{ 'vehiclesManagement.addSingle.identifierType' | t }}
                            <span class="text-danger ms-1" aria-hidden="true">*</span>
                        </label>
                        <app-dropdown [options]="identifierTypeOptions" [placeholder]="'vehiclesManagement.addSingle.identifierTypePlaceholder' | t" [value]="identifierType()" (valueChange)="identifierType.set($event)" />
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label small mb-1 d-block">
                            {{ 'vehiclesManagement.addSingle.displayLocation' | t }}
                            <span class="text-danger ms-1" aria-hidden="true">*</span>
                        </label>
                        <div class="d-flex gap-3 mt-2">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="displayLocation" id="locationMazadat" value="mazadat" [checked]="displayLocation() === 'mazadat'" (change)="displayLocation.set('mazadat')" />
                                <label class="form-check-label" for="locationMazadat">
                                    {{ 'vehiclesManagement.addSingle.locationMazadat' | t }}
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="displayLocation" id="locationSeller" value="seller" [checked]="displayLocation() === 'seller'" (change)="displayLocation.set('seller')" />
                                <label class="form-check-label" for="locationSeller">
                                    {{ 'vehiclesManagement.addSingle.locationSeller' | t }}
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label small mb-1 d-block">
                            {{ 'vehiclesManagement.addSingle.vehicleCity' | t }}
                            <span class="text-danger ms-1" aria-hidden="true">*</span>
                        </label>
                        <app-dropdown [options]="cityOptions" [placeholder]="'vehiclesManagement.addSingle.vehicleCityPlaceholder' | t" [value]="vehicleCity()" (valueChange)="vehicleCity.set($event)" />
                    </div>
                </div>

                <div class="d-flex justify-content-start mt-4 pt-2">
                    <app-button variant="primary" size="md" [label]="'vehiclesManagement.addSingle.next' | t" icon="pi pi-arrow-left" iconPosition="end" (clicked)="onNext()" />
                </div>
            </div>
        </div>
    </div>
</div>
