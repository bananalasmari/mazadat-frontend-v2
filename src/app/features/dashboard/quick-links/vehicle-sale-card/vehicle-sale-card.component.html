<div class="card shadow-sm rounded-3 border-0 flex-shrink-0 h-100" style="min-width: 330px; max-width: 361px; min-height: 200px;">
  <div class="card-body d-flex flex-column h-100 overflow-visible">
    <div class="flex-grow-1 min-h-0">
      <div class="d-flex align-items-start gap-2 mb-2">
        <img [src]="item().imageUrl ?? demoCarImage()" [alt]="item().vehicleName" class="rounded flex-shrink-0 object-fit-cover" style="width: 4rem; height: 3rem; object-fit: cover;" />
        <div class="min-w-0">
          <app-typography tag="h4" variant="h6" weight="bold" extraClass="mb-1" [text]="item().title ?? ''" />
          <app-typography tag="p" color="muted" extraClass="mb-0" [text]="item().vehicleName" />
          <app-typography tag="p" color="muted" extraClass="mb-0" [text]="item().purchaseType" />
        </div>
      </div>
      <div class="d-flex">
        <app-typography tag="p" variant="small" weight="semibold" extraClass="mb-0" [text]="item().price" />
        <img src="/assets/icons/riyal.svg" alt="riyal" class="mb-2" style="width: 1.5rem; height: 1.5rem;" />
      </div>
    </div>
    <div class="d-flex gap-2 mt-auto pt-2 align-items-center flex-shrink-0">
      @if (status() === 'accepted') {
        <app-tag [value]="acceptedLabel()" severity="success" />
      } @else if (status() === 'rejected') {
        <app-tag [value]="rejectedLabel()" severity="danger" />
      } @else {
        <app-button [label]="item().rejectLabel ?? ''" variant="danger" size="sm" (clicked)="rejectSale.emit(item())" />
        <app-button [label]="item().acceptLabel ?? ''" variant="success" size="sm" (clicked)="acceptSale.emit(item())" />
      }
    </div>
  </div>
</div>
