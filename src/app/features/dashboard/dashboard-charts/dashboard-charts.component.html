<div class="dashboard-charts row g-3">
  <div class="col-12 col-lg-6">
    <div class="dashboard-chart-card rounded-3 p-3 h-100">
      <app-typography tag="h3" variant="h5" weight="bold" extraClass="mb-1" [text]="barTitle()" />
      <app-typography tag="p" variant="small" color="muted" extraClass="mb-3" [text]="barSubtitle()" />
      <div #barChartRef class="dashboard-chart-bar" style="width: 100%; height: 260px;"></div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="dashboard-chart-card rounded-3 p-3 h-100">
      <app-typography tag="h3" variant="h5" weight="bold" extraClass="mb-1" [text]="pieTitle()" />
      <app-typography tag="p" variant="small" color="muted" extraClass="mb-3" [text]="pieSubtitle()" />
      <div #pieChartRef class="dashboard-chart-pie" style="width: 100%; height: 280px;"></div>
    </div>
  </div>
</div>
